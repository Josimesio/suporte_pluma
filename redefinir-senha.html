<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha - Suporte ORACLE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/supabase-config.js?v=20260717-2"></script>
  <script src="js/traducao.js?v=20260717-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js?v=20260717-supabase-7"></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #003f35; }
    .reset-card { width: min(430px, calc(100% - 32px)); border-top: 5px solid #f2c700; }
  </style>
</head>
<body>
  <main class="card reset-card shadow">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Redefinir senha</h1>
      <p class="text-muted">Digite uma nova senha com pelo menos 8 caracteres.</p>
      <form id="formRedefinir">
        <label for="novaSenha" class="form-label">Nova senha</label>
        <input id="novaSenha" type="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required>
        <label for="confirmarSenha" class="form-label">Confirmar nova senha</label>
        <input id="confirmarSenha" type="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required>
        <button type="submit" class="btn btn-success w-100">Salvar nova senha</button>
      </form>
      <div id="mensagem" class="mt-3 text-center"></div>
    </div>
  </main>

  <script>
    document.getElementById("formRedefinir").addEventListener("submit", async function (evento) {
      evento.preventDefault();
      const senha = document.getElementById("novaSenha").value;
      const confirmacao = document.getElementById("confirmarSenha").value;
      const mensagem = document.getElementById("mensagem");
      const botao = this.querySelector("button[type='submit']");

      if (senha !== confirmacao) {
        mensagem.textContent = "As senhas não são iguais.";
        return;
      }

      botao.disabled = true;
      mensagem.textContent = "Salvando...";
      const supabase = await obterClienteSupabase();
      const { error } = await supabase.auth.updateUser({ password: senha });

      if (error) {
        botao.disabled = false;
        mensagem.textContent = `Não foi possível alterar: ${error.message}`;
        return;
      }

      mensagem.textContent = "Senha alterada. Redirecionando para o painel...";
      setTimeout(() => window.location.replace("index.html"), 1200);
    });
  </script>
</body>
</html>
